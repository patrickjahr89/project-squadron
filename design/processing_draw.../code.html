<canvas id="shader-canvas-ANIMATION_103" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_103');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float scanline = sin(uv.y * 800.0 + u_time * 10.0) * 0.04;
    float grid = (step(0.98, fract(uv.x * 20.0)) + step(0.98, fract(uv.y * 20.0))) * 0.1;
    
    vec3 color = vec3(0.02, 0.05, 0.04); // Base dark teal
    color += vec3(0.0, 1.0, 0.8) * grid; // Cyan grid
    color -= scanline; // Darker scanlines
    
    // Add some "Matrix" like vertical noise
    float noise = fract(sin(dot(uv.xx + floor(u_time * 5.0), vec2(12.9898, 78.233))) * 43758.5453);
    if(noise > 0.99) color += vec3(0.0, 0.5, 0.4) * 0.2;

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        const scrambleTextElement = document.getElementById('scramble-text');
        const bigScrambleElement = document.getElementById('big-scramble');
        const progressTextElement = document.getElementById('progress-text');
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
        const names = ['ALICE', 'BOB', 'CHARLIE', 'DAVE', 'EVE', 'FRANK', 'GRACE', 'TEAM ALPHA', 'TEAM BRAVO', 'TEAM CHARLIE'];
        
        let scrambleInterval;
        let bigScrambleInterval;
        
        // Start small scramble after delay
        setTimeout(() => {
            scrambleInterval = setInterval(() => {
                let result = '';
                for(let i=0; i<8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                scrambleTextElement.innerText = result;
            }, 50);
        }, 2500);

        // Big scramble effect
        setTimeout(() => {
            let cycles = 0;
            bigScrambleInterval = setInterval(() => {
                if(cycles % 5 === 0) {
                    bigScrambleElement.innerText = names[Math.floor(Math.random() * names.length)];
                } else {
                    let result = '';
                    for(let i=0; i<8; i++) {
                        result += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    bigScrambleElement.innerText = result;
                }
                cycles++;
            }, 80);
        }, 3000);

        // Fake progress percentage
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += Math.random() * 5;
            if(progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
                clearInterval(scrambleInterval);
                clearInterval(bigScrambleInterval);
                scrambleTextElement.innerText = 'COMPLETE';
                bigScrambleElement.innerText = 'DRAW FINALIZED';
                bigScrambleElement.classList.add('text-secondary-container');
                bigScrambleElement.classList.remove('text-primary-container');
            }
            progressTextElement.innerText = Math.floor(progress) + '%';
        }, 200);

    </script>
