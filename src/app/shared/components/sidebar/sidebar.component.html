<aside
  class="hidden md:flex flex-col h-full py-margin bg-surface-container-lowest border-r border-outline-variant w-64 shrink-0 transition-all duration-200 ease-in-out relative z-20"
>
  <div class="px-margin mb-8 flex flex-col gap-2">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 border border-outline-variant rounded overflow-hidden p-0.5"
      >
        <img
          alt="System Operator Avatar"
          class="w-full h-full object-cover grayscale opacity-80"
          src="assets/logo/logo.png"
        />
      </div>
      <div>
        <div
          class="font-headline-md text-headline-md font-bold text-primary tracking-tighter uppercase text-sm"
        >
          TC-GO
        </div>
        <div
          class="font-label-sm text-label-sm text-on-surface-variant font-code-md"
        >
          v1.0.0
        </div>
      </div>
    </div>
  </div>

  <nav
    class="flex-1 overflow-y-auto overflow-x-hidden w-full flex flex-col gap-1 px-4"
  >
    <button
      (click)="store.navigate('dashboard')"
      [ngClass]="
        isActive('/dashboard')
          ? 'text-primary font-bold border-l-2 border-primary-container bg-surface-container-low fill-icon'
          : 'text-on-surface-variant hover:bg-surface-container-highest hover:text-primary border-l-2 border-transparent'
      "
      class="group flex items-center gap-3 py-3 px-3 pl-4 transition-all duration-200 ease-in-out font-label-sm text-label-sm rounded w-full text-left"
    >
      <span
        class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110"
        [ngClass]="isActive('/dashboard') ? 'text-primary-container' : ''"
        >dashboard</span
      >
      <span
        class="tracking-widest uppercase"
        [ngClass]="
          isActive('/dashboard')
            ? 'drop-shadow-[0_0_8px_rgba(0,255,194,0.4)]'
            : ''
        "
        >Dashboard</span
      >
    </button>
    <button
      (click)="store.navigate('people')"
      [ngClass]="
        isActive('/people')
          ? 'text-primary font-bold border-l-2 border-primary-container bg-surface-container-low fill-icon'
          : 'text-on-surface-variant hover:bg-surface-container-highest hover:text-primary border-l-2 border-transparent'
      "
      class="group flex items-center gap-3 py-3 px-3 pl-4 transition-all duration-200 ease-in-out font-label-sm text-label-sm rounded w-full text-left"
    >
      <span
        class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110"
        [ngClass]="isActive('/people') ? 'text-primary-container' : ''"
        >groups</span
      >
      <span
        class="tracking-widest uppercase"
        [ngClass]="
          isActive('/people') ? 'drop-shadow-[0_0_8px_rgba(0,255,194,0.4)]' : ''
        "
        >People</span
      >
    </button>
    <button
      (click)="store.navigate('teams')"
      [ngClass]="
        isActive('/teams')
          ? 'text-primary font-bold border-l-2 border-primary-container bg-surface-container-low fill-icon'
          : 'text-on-surface-variant hover:bg-surface-container-highest hover:text-primary border-l-2 border-transparent'
      "
      class="group flex items-center gap-3 py-3 px-3 pl-4 transition-all duration-200 ease-in-out font-label-sm text-label-sm rounded w-full text-left"
    >
      <span
        class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110"
        [ngClass]="isActive('/teams') ? 'text-primary-container' : ''"
        >hub</span
      >
      <span
        class="tracking-widest uppercase"
        [ngClass]="
          isActive('/teams') ? 'drop-shadow-[0_0_8px_rgba(0,255,194,0.4)]' : ''
        "
        >Teams</span
      >
    </button>
    @if (store.canShowResults()) {
      <button
        (click)="store.navigate('draw_result')"
        [ngClass]="
          isActive('/results')
            ? 'text-primary font-bold border-l-2 border-primary-container bg-surface-container-low fill-icon'
            : 'text-on-surface-variant hover:bg-surface-container-highest hover:text-primary border-l-2 border-transparent'
        "
        class="group flex items-center gap-3 py-3 px-3 pl-4 transition-all duration-200 ease-in-out font-label-sm text-label-sm rounded w-full text-left"
      >
        <span
          class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110"
          [ngClass]="isActive('/results') ? 'text-primary-container' : ''"
          >analytics</span
        >
        <span
          class="tracking-widest uppercase"
          [ngClass]="
            isActive('/results')
              ? 'drop-shadow-[0_0_8px_rgba(0,255,194,0.4)]'
              : ''
          "
          >Results</span
        >
      </button>
    }
  </nav>

  <div class="px-margin mt-auto pt-6 flex flex-col gap-4">
    <div class="w-full h-px bg-outline-variant"></div>
    <button
      (click)="store.initiateDrawConfig()"
      [disabled]="!store.canInitiateDraw()"
      class="w-full border border-primary-container bg-surface-container-lowest text-primary-container hover:bg-primary-container hover:text-background disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-surface-container-lowest disabled:hover:text-primary-container disabled:hover:shadow-none py-2 px-4 font-label-sm text-label-sm uppercase transition-all duration-200 shadow-[0_0_10px_rgba(0,255,194,0)] hover:shadow-[0_0_15px_rgba(0,255,194,0.4)] flex justify-center items-center gap-2"
    >
      <span class="material-symbols-outlined text-[16px]">terminal</span>
      INITIATE_DRAW
    </button>
  </div>
</aside>
